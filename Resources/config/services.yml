services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Trendix\AdminBundle\Component\Lista\ListaFactory:
        arguments: ["@service_container","@doctrine.orm.entity_manager"]
        public: true
  Trendix\AdminBundle\Component\Menu\MenuGenerator:
        public: true
        autowire: true
        arguments: ['@service_container', '@parameter_bag']
  trendix_image:
        class: Trendix\AdminBundle\Form\ImageType
        arguments: ["@doctrine.orm.entity_manager"]
        tags:
            - { name: form.type }
  trendix_gallery:
        class: Trendix\AdminBundle\Form\GalleryType
        arguments: ["@doctrine.orm.entity_manager"]
        tags:
            - { name: form.type }
  trendix_location:
        class: Trendix\AdminBundle\Form\LocationType
        arguments: ["@service_container"]
        tags:
            - { name: form.type }
  trendix_file:
          class: Trendix\AdminBundle\Form\FileType
          arguments: ["@service_container"]
          tags:
              - { name: form.type }
  admin.sitemap_generator:
            class: Trendix\AdminBundle\Component\Sitemap\SitemapGenerator
            arguments: ["@service_container"]
  admin.locale_listener:
          class: Trendix\AdminBundle\EventListener\LocaleListener
          arguments: ['%kernel.default_locale%']
          tags:
              - { name: kernel.event_subscriber }
  admin.user_locale_listener:
          class: Trendix\AdminBundle\EventListener\UserLocaleListener
          arguments: ['@session']
          tags:
              - { name: kernel.event_listener, event: security.interactive_login, method: onInteractiveLogin }
  trendix_twig:
          public: true
          class: Trendix\AdminBundle\Twig\TrendixExtension
          arguments: ['@router']
          tags:
              - { name: twig.extension }
  admin.lista.factory:
    alias: Trendix\AdminBundle\Component\Lista\ListaFactory
    public: true
  admin.menu.generator:
    alias: Trendix\AdminBundle\Component\Menu\MenuGenerator
    public: true

  parameter_bag:
    class: Symfony\Component\DependencyInjection\ParameterBag\ContainerBag
    public: true
    arguments: ["@service_container"]