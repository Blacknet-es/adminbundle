trendix_base:
    resource: "@TrendixAdminBundle/Controller/BaseController.php"
    type:     annotation
    prefix:   /

trendix_admin:
    resource: "@TrendixAdminBundle/Controller/AdminController.php"
    type:     annotation
    prefix:   /

trendix_images:
    resource: "@TrendixAdminBundle/Controller/ImagesController.php"
    type:     annotation
    prefix:   /
    options:
        expose: true

fos_user:
    resource: "@FOSUserBundle/Resources/config/routing/all.xml"

admin_login:
    path:  /admin/login
    defaults: { _controller: FOSUserBundle:Security:login }

admin_check:
    path:  /admin/login_check
    defaults: { _controller: FOSUserBundle:Security:check }

admin_logout:
    path:  /admin/logout
    defaults: { _controller: FOSUserBundle:Security:logout }

fos_js_routing:
    resource: "@FOSJsRoutingBundle/Resources/config/routing/routing.xml"

trendix_admin_reset:
    resource: "@TrendixAdminBundle/Controller/ResetController.php"
    type:     annotation
    prefix:   /reset